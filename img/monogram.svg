<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BK">
  <!-- Theme-aware: the tile inverts with the viewer's colour scheme so the
       favicon stays legible in both light and dark browser chrome.

       The BK is outlined paths, not live <text>. An SVG favicon renders in
       the browser's own font context, where the requested family may not be
       installed and metrics differ, so a <text> monogram shifts or falls back
       between machines and platforms. Outlines render identically everywhere.
       Regenerate with tools/make-monogram.py if the letterforms ever change. -->
  <style>
    .tile { fill: #111114; }
    .mark { fill: #FCFCFB; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #F2F2F0; }
      .mark { fill: #0C0C0E; }
    }
  </style>
